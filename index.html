<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>StepStore — Sneakers & Chaussures</title>
    <meta name="description" content="StepStore : la boutique en ligne des sneakers tendance. Running, basketball, lifestyle — livraison rapide, retours gratuits 30 jours." />
    <meta name="theme-color" content="#FF5C1A" />
    <meta name="color-scheme" content="light" />
    <meta property="og:title" content="StepStore — Sneakers & Chaussures" />
    <meta property="og:description" content="Des sneakers qui font vibrer la rue. Qualité premium, prix imbattables." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="icons/icon-512.png" />
    <link rel="apple-touch-icon" href="icons/icon-512.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ShoeStore",
      "name": "StepStore",
      "description": "Boutique en ligne de sneakers et chaussures tendance.",
      "currenciesAccepted": "EUR",
      "paymentAccepted": "Carte bancaire, PayPal"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Garde-fou anti-écran blanc : affiche l'erreur si l'application ne démarre pas -->
    <script>
      window.addEventListener("error", function (e) {
        var root = document.getElementById("root");
        if (root && root.children.length === 0) {
          root.innerHTML =
            "<div style='font-family:system-ui,sans-serif;max-width:480px;margin:80px auto;padding:28px;border:1px solid #eee;border-radius:16px;text-align:center;color:#333'>" +
            "<div style='font-size:40px'>⚠️</div>" +
            "<h1 style='font-size:20px;margin:12px 0 6px'>Impossible de charger l'application / تعذر تحميل التطبيق</h1>" +
            "<p style='font-size:13px;color:#777;word-break:break-word'>" +
            (e.message || "Erreur inconnue") +
            "</p>" +
            "<p style='font-size:13px;color:#777'>Rechargez la page ou videz le cache du navigateur.</p>" +
            "</div>";
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
