<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>StepStore — Sneakers & Chaussures</title>
<meta name="description" content="StepStore : boutique de sneakers — FR/AR, DZD, vue 3D, commande WhatsApp." />
<meta name="theme-color" content="#FF5C1A" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23FF5C1A'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>S</text></svg>" />
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
/* ==================== BASE & THÈME ==================== */
:root{
  --primary:#FF5C1A; --bg:#ffffff; --text:#0f0f0f; --surface:#F6F3EF; --muted:#6d6d6d;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; transition:background .35s,color .35s;
}
h1,h2,h3,h4{font-weight:800;line-height:1.15}
a{color:inherit;text-decoration:none}
img{display:block}
button{font-family:inherit}
[dir="rtl"] body{letter-spacing:0}
.container{max-width:1220px;margin:0 auto;padding:0 16px}
@media(min-width:768px){.container{padding:0 24px}}

/* ==================== BOUTONS & FORMULAIRES ==================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;
  font-weight:700;cursor:pointer;padding:10px 20px;font-size:14px;transition:all .2s;background:transparent;color:inherit}
.btn:active{transform:scale(.97)}
.btn-lg{padding:14px 28px;font-size:15px}
.btn-sm{padding:7px 13px;font-size:12.5px}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 10px 24px -8px rgba(255,92,26,.55)}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-dark{background:#111;color:#fff}
.btn-dark:hover{background:#000}
.btn-outline{background:transparent;border:1.5px solid rgba(0,0,0,.22)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-ghost{background:rgba(0,0,0,.05)}
.btn-ghost:hover{background:rgba(0,0,0,.11)}
.btn-red{background:#fde8e8;color:#d33}
.btn-red:hover{background:#fbd5d5}
.input{width:100%;border:1.5px solid rgba(0,0,0,.13);border-radius:12px;background:var(--bg);color:var(--text);
  padding:10px 14px;font-size:14px;outline:none;transition:border .2s,box-shadow .2s;font-family:inherit}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,92,26,.2)}
.label{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(0,0,0,.5);margin-bottom:6px}
.card{background:var(--bg);border:1px solid rgba(0,0,0,.08);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid rgba(0,0,0,.14);background:var(--bg);
  border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;color:rgba(0,0,0,.65);white-space:nowrap;transition:all .18s}
.chip:hover{border-color:var(--primary);color:var(--text)}
.chip-active{background:var(--primary);border-color:var(--primary);color:#fff}
select.input{appearance:auto}

/* ==================== BANDEAU + HEADER ==================== */
.topmarquee{background:var(--primary);color:#fff;overflow:hidden;padding:8px 0;font-size:11px;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase}
.marquee-track{display:flex;width:max-content;animation:marquee 30s linear infinite}
.marquee-track span{padding-inline:30px;white-space:nowrap}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.site-header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.08)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px}
.logo-mark{width:36px;height:36px;border-radius:11px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:18px;box-shadow:0 6px 14px rgba(255,92,26,.35)}
.logo img{height:36px;max-width:150px;object-fit:contain}
.nav-desktop{display:none;gap:4px}
@media(min-width:900px){.nav-desktop{display:flex}}
.nav-link{padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;color:rgba(0,0,0,.6)}
.nav-link:hover{background:rgba(0,0,0,.05);color:#000}
.nav-active{background:var(--primary);color:#fff!important}
.nav-active-dark{background:#111;color:#fff}
.header-actions{display:flex;align-items:center;gap:8px}
.lang-switch{display:flex;border:1.5px solid rgba(0,0,0,.12);border-radius:999px;padding:3px}
.lang-switch button{border:none;background:transparent;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;cursor:pointer;color:rgba(0,0,0,.55)}
.lang-switch button.on{background:var(--primary);color:#fff}
.cart-btn{position:relative}
.cart-badge{position:absolute;top:-7px;inset-inline-end:-7px;background:var(--primary);color:#fff;font-size:10px;
  font-weight:800;min-width:19px;height:19px;border-radius:999px;display:grid;place-items:center;padding:0 5px}
.burger{display:grid;place-items:center;width:40px;height:40px;border:none;background:rgba(0,0,0,.05);border-radius:12px;cursor:pointer;font-size:18px}
@media(min-width:900px){.burger{display:none}}
.mobile-menu{display:none;border-top:1px solid rgba(0,0,0,.06);padding:8px 0 14px}
.mobile-menu.open{display:block}
.mobile-menu a{display:block;padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px}
.mobile-menu a:hover{background:rgba(0,0,0,.05)}

/* ==================== HERO ==================== */
.hero{padding:44px 0 52px;position:relative;overflow:hidden}
.hero-glow{position:absolute;inset-inline-end:-160px;top:-160px;width:520px;height:520px;border-radius:50%;
  background:var(--primary);opacity:.14;filter:blur(90px);pointer-events:none}
.hero-grid{display:grid;gap:36px;align-items:center}
@media(min-width:960px){.hero-grid{grid-template-columns:1fr 1fr}}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border-radius:999px;
  padding:7px 16px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 8px 20px rgba(255,92,26,.35)}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.7);opacity:.5}}
.hero h1{font-size:38px;margin:18px 0 14px}
.hero h1 .accent{color:var(--primary)}
@media(min-width:640px){.hero h1{font-size:52px}}
.hero-sub{color:rgba(0,0,0,.58);font-size:16px;line-height:1.65;max-width:520px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero-stats{display:flex;gap:34px;margin-top:34px}
.hero-stats b{font-size:26px;display:block}
.hero-stats span{font-size:12px;color:rgba(0,0,0,.45)}
.hero-fig{position:relative;max-width:520px;margin:0 auto;width:100%}
.hero-fig::before{content:"";position:absolute;inset:22px 32px -24px;background:var(--primary);border-radius:40px;transform:rotate(3deg)}
.hero-fig img{position:relative;width:100%;aspect-ratio:5/4;object-fit:cover;border-radius:40px;box-shadow:0 24px 50px rgba(0,0,0,.25);
  transition:transform .5s;transform-style:preserve-3d}
.hero-fig:hover img{transform:perspective(1100px) rotateY(-5deg) rotateX(2deg) scale(1.01)}
.float-card{position:absolute;background:#fff;border-radius:16px;padding:11px 15px;box-shadow:0 14px 30px rgba(0,0,0,.14);z-index:2;animation:float 5s ease-in-out infinite}
.float-card small{display:block;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(0,0,0,.45)}
.float-card b{color:var(--primary);font-size:17px}
.float-card span{font-size:13px;font-weight:700}
.fc1{top:22px;inset-inline-start:-12px}
.fc2{bottom:34px;inset-inline-end:-10px}
@media(min-width:640px){.fc1{inset-inline-start:-34px}.fc2{inset-inline-end:-26px}}
@keyframes float{50%{transform:translateY(-12px)}}

/* ==================== SECTIONS ==================== */
.section{padding:52px 0}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
.eyebrow{color:var(--primary);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.section-title{font-size:30px;margin-top:6px}
@media(min-width:640px){.section-title{font-size:36px}}
.surface{background:var(--surface)}
.grid-products{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid-cats{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:768px){.grid-cats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1080px){.grid-cats{grid-template-columns:repeat(6,1fr)}}

/* ==================== CARTE PRODUIT (tilt 3D) ==================== */
.p-card{position:relative;border-radius:18px;overflow:hidden;background:var(--bg);
  border:1px solid rgba(0,0,0,.08);box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;flex-direction:column;
  transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s;will-change:transform}
.p-card:hover{box-shadow:0 28px 55px -14px rgba(0,0,0,.32)}
.p-card-img{position:relative;aspect-ratio:1;overflow:hidden;background:#f1efec}
.p-card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.p-card:hover .p-card-img img{transform:scale(1.07)}
.p-badges{position:absolute;top:12px;inset-inline-start:12px;display:flex;flex-direction:column;gap:6px}
.p-badge{background:var(--primary);color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;padding:4px 10px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.p-badge.dark{background:#111}
.p-badge3d{position:absolute;bottom:12px;inset-inline-start:12px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;
  font-weight:800;border-radius:999px;padding:4px 10px;backdrop-filter:blur(4px)}
.quick-add{position:absolute;bottom:12px;inset-inline-end:12px;opacity:0;transform:translateY(8px);transition:all .3s}
.p-card:hover .quick-add,.quick-add:focus-visible{opacity:1;transform:none}
.p-card-body{padding:15px;display:flex;flex-direction:column;gap:7px;flex:1}
.p-brand{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(0,0,0,.42)}
.p-name{font-size:15px;font-weight:800}
.p-price{display:flex;align-items:center;gap:9px;margin-top:auto;padding-top:4px}
.p-price b{color:var(--primary);font-size:18px}
.p-price s{color:rgba(0,0,0,.4);font-size:13px}
.p-swatches{display:flex;gap:6px;margin-top:2px}
.p-swatch{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.p-rating{font-size:12px;font-weight:700;color:rgba(0,0,0,.6)}
.p-meta{display:flex;justify-content:space-between;align-items:center}
.p-glare{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;z-index:2}
.p-card:hover .p-glare{opacity:1}

/* ==================== BANNIÈRE PROMO ==================== */
.promo{position:relative;border-radius:30px;overflow:hidden}
.promo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.promo .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,.55) 55%,transparent)}
[dir="rtl"] .promo .veil{background:linear-gradient(-90deg,rgba(0,0,0,.85),rgba(0,0,0,.55) 55%,transparent)}
.promo-inner{position:relative;padding:44px 30px;display:flex;flex-direction:column;align-items:flex-start;gap:16px;max-width:520px}
@media(min-width:640px){.promo-inner{padding:58px 48px}}
.promo-inner h2{color:#fff;font-size:30px}
@media(min-width:640px){.promo-inner h2{font-size:44px}}
.promo-inner p{color:rgba(255,255,255,.75);font-size:14.5px;line-height:1.65}
.features{display:grid;gap:22px;grid-template-columns:repeat(2,1fr);border-top:1px solid rgba(0,0,0,.08);padding:40px 0}
@media(min-width:1024px){.features{grid-template-columns:repeat(4,1fr)}}
.feature{display:flex;gap:13px;align-items:flex-start}
.feature .f-ico{width:44px;height:44px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:20px;flex:none}
.feature b{font-size:13.5px;display:block}
.feature p{font-size:12px;color:rgba(0,0,0,.5);margin-top:3px;line-height:1.5}

/* ==================== FOOTER ==================== */
.footer{background:#101010;color:#fff}
.f-news{border-bottom:1px solid rgba(255,255,255,.1)}
.f-news-inner{display:flex;flex-direction:column;gap:18px;justify-content:space-between;padding:40px 0}
@media(min-width:800px){.f-news-inner{flex-direction:row;align-items:center}}
.f-news h2{font-size:24px}
.f-news h2 b{color:var(--primary)}
.f-news p{color:rgba(255,255,255,.55);font-size:13.5px;margin-top:6px}
.f-news-form{display:flex;gap:10px;max-width:430px;width:100%}
.f-news-form input{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.18);color:#fff;border-radius:12px;
  padding:11px 15px;flex:1;font-size:14px;outline:none}
.f-news-form input::placeholder{color:rgba(255,255,255,.4)}
.f-cols{display:grid;gap:34px;grid-template-columns:repeat(2,1fr);padding:46px 0}
@media(min-width:900px){.f-cols{grid-template-columns:2fr 1fr 1fr 1fr}}
.f-cols h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:15px}
.f-cols ul{list-style:none;display:flex;flex-direction:column;gap:11px;font-size:13.5px}
.f-cols a{color:rgba(255,255,255,.75)}
.f-cols a:hover{color:var(--primary)}
.f-about p{color:rgba(255,255,255,.55);font-size:13.5px;line-height:1.6;max-width:280px;margin-top:14px}
.f-bottom{border-top:1px solid rgba(255,255,255,.1);padding:20px 0;display:flex;flex-wrap:wrap;gap:10px;
  justify-content:space-between;font-size:12px;color:rgba(255,255,255,.45)}
.f-logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px}
.f-logo img{height:32px;max-width:140px;object-fit:contain}

/* ==================== FICHE PRODUIT ==================== */
.breadcrumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:16px 0;font-size:12px;color:rgba(0,0,0,.45)}
.breadcrumb a:hover{color:var(--primary)}
.pd-grid{display:grid;gap:34px;padding-bottom:60px}
@media(min-width:960px){.pd-grid{grid-template-columns:1fr 1fr;gap:50px}}
.view-switch{display:inline-flex;border:1.5px solid rgba(0,0,0,.1);border-radius:999px;background:#fff;padding:4px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.view-switch button{border:none;background:transparent;border-radius:999px;padding:8px 16px;font-size:12px;font-weight:800;cursor:pointer;color:rgba(0,0,0,.55)}
.view-switch button.on{background:var(--primary);color:#fff;box-shadow:0 4px 10px rgba(255,92,26,.3)}
.view-switch button.on.dark{background:#111}
.pd-stage{position:relative;aspect-ratio:1;border-radius:26px;overflow:hidden;background:#f1efec}
.pd-stage[data-mode="3d"]{background:radial-gradient(120% 120% at 50% 15%,rgba(255,92,26,.18),#fff 55%,#f1efec)}
.pd-stage img{width:100%;height:100%;object-fit:cover}
.pd-stage .hint{position:absolute;bottom:12px;inset-inline:0;text-align:center;font-size:11px;font-weight:700;color:rgba(0,0,0,.4);pointer-events:none}
.pd-loading{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.pd-loading .box{display:flex;flex-direction:column;align-items:center;gap:12px;background:rgba(255,255,255,.85);
  border-radius:16px;padding:20px 26px;box-shadow:0 10px 30px rgba(0,0,0,.12);backdrop-filter:blur(6px)}
.spinner{width:30px;height:30px;border-radius:50%;border:4px solid rgba(255,92,26,.2);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pd-thumbs{display:flex;gap:10px;margin-top:12px}
.pd-thumb{width:76px;height:76px;border-radius:14px;overflow:hidden;border:2px solid transparent;cursor:pointer;opacity:.6;background:#f1efec;transition:all .2s}
.pd-thumb img{width:100%;height:100%;object-fit:cover}
.pd-thumb.on{border-color:var(--primary);opacity:1;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.pd-info .p-brand{font-size:12px}
.pd-info h1{font-size:30px;margin-top:6px}
@media(min-width:640px){.pd-info h1{font-size:38px}}
.pd-rate{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:12px;font-size:13.5px;font-weight:700}
.pd-rate .stars{color:#f5a623}
.stock-pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 13px;font-size:11.5px;font-weight:800}
.stock-pill.ok{background:#e9f9ef;color:#15803d}
.stock-pill.ko{background:#fdeaea;color:#d33}
.stock-pill .dot{width:6px;height:6px;border-radius:50%;background:#16a34a;animation:pulse 1.4s infinite}
.stock-pill.ko .dot{background:#d33;animation:none}
.pd-price{display:flex;align-items:flex-end;gap:12px;margin-top:18px}
.pd-price b{color:var(--primary);font-size:38px}
.pd-price s{color:rgba(0,0,0,.4);font-size:18px;margin-bottom:6px}
.pd-desc{color:rgba(0,0,0,.6);font-size:14.5px;line-height:1.7;margin-top:18px;max-width:540px}
.opt-block{margin-top:26px}
.opt-title{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(0,0,0,.5);margin-bottom:11px}
.opt-title b{color:var(--primary);text-transform:none;letter-spacing:0}
.swatches{display:flex;gap:11px;flex-wrap:wrap}
.swatch{width:42px;height:42px;border-radius:50%;border:2.5px solid rgba(0,0,0,.13);cursor:pointer;display:grid;place-items:center;
  font-weight:900;transition:all .18s;color:transparent}
.swatch:hover{transform:scale(1.08)}
.swatch.on{border-color:var(--primary);transform:scale(1.12)}
.swatch.on{color:inherit}
.sizes{display:flex;flex-wrap:wrap;gap:9px}
.size-btn{min-width:46px;height:44px;padding:0 8px;border-radius:13px;border:2px solid rgba(0,0,0,.12);
  background:var(--bg);font-weight:800;font-size:14px;cursor:pointer;transition:all .18s}
.size-btn:hover{border-color:var(--primary)}
.size-btn.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 8px 18px rgba(255,92,26,.3)}
.size-err{color:#d33;font-size:12px;font-weight:700;margin-top:9px;display:none}
.qty-box{display:inline-flex;align-items:center;gap:4px;border:2px solid rgba(0,0,0,.12);border-radius:999px;padding:4px}
.qty-box button{width:36px;height:36px;border:none;background:transparent;border-radius:50%;cursor:pointer;font-size:16px;font-weight:800}
.qty-box button:hover{background:rgba(0,0,0,.06)}
.qty-box span{width:28px;text-align:center;font-weight:800;font-size:16px}
.pd-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;align-items:center}
.pd-perks{display:grid;gap:12px;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(0,0,0,.08);
  padding-top:22px;margin-top:30px;font-size:12.5px;font-weight:700}
.pd-perks span{display:flex;align-items:center;gap:9px}
.pd-perks .pi{color:var(--primary);font-size:17px}

/* ==================== PANIER (TIROIR) ==================== */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .3s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;inset-inline-end:0;bottom:0;width:100%;max-width:430px;background:#fff;z-index:61;
  box-shadow:-20px 0 60px rgba(0,0,0,.25);display:flex;flex-direction:column;
  transform:translateX(105%);transition:transform .32s cubic-bezier(.22,1,.36,1)}
[dir="rtl"] .drawer{transform:translateX(-105%)}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid rgba(0,0,0,.08)}
.drawer-head h2{font-size:17px;display:flex;align-items:center;gap:9px}

/* ==================== OUTILS ==================== */
function t(key, vars){
  var s = (T[lang] && T[lang][key]) || T.fr[key] || key;
  if(vars){ for(var k in vars){ s = s.split("{"+k+"}").join(String(vars[k])); } }
  return s;
}
function trLocalized(fr, ar){ return lang === "ar" && ar ? ar : fr; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmt(v){
  try{ return new Intl.NumberFormat(lang === "ar" ? "ar-DZ" : "fr-DZ", {style:"currency",currency:"DZD",maximumFractionDigits:0}).format(v); }
  catch(e){ return v + " DA"; }
}
function uid(prefix){ return (prefix||"item") + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7); }
function parseList(s){ var out = [], seen = {}; String(s||"").split(/[,;\n]/).forEach(function(x){ x = x.trim(); if(x && !seen[x]){ seen[x]=1; out.push(x); } }); return out; }
function getByPath(obj, arr){ for(var i=0;i<arr.length;i++){ if(obj==null) return undefined; obj = obj[arr[i]]; } return obj; }
function setByPath(obj, arr, val){ for(var i=0;i<arr.length-1;i++){ obj = obj[arr[i]]; } obj[arr[arr.length-1]] = val; }
function readFileAsDataUrl(file, cb){ var r = new FileReader(); r.onload = function(){ cb(String(r.result)); }; r.onerror = function(){ cb(null); }; r.readAsDataURL(file); }

var LS_CART = "stepstore_standalone_cart";
var LS_LANG = "stepstore_lang";
var LS_CLIENT = "stepstore_client";

var state = loadState();

try { var rawCart = localStorage.getItem(LS_CART); if(rawCart){ cart = JSON.parse(rawCart) || []; } } catch(e){}

function loadState(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    if(raw){
      var d = JSON.parse(raw);
      var s = d.settings || {};
      var merged = Object.assign({}, DEFAULT_SETTINGS, s);
      return { products:(d.products && d.products.length)?d.products:DEFAULT_PRODUCTS.slice(),
               categories:(d.categories && d.categories.length)?d.categories:DEFAULT_CATEGORIES.slice(),
               settings:merged };
    }
  } catch(e){}
  return { products:DEFAULT_PRODUCTS.slice(), categories:DEFAULT_CATEGORIES.slice(), settings:Object.assign({},DEFAULT_SETTINGS) };
}
function saveState(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({products:state.products,categories:state.categories,settings:state.settings})); } catch(e){}
}
function saveCart(){ try { localStorage.setItem(LS_CART, JSON.stringify(cart)); } catch(e){} }
function saveLang(){ try { localStorage.setItem(LS_LANG, lang); } catch(e){} }
function saveClient(){ try { localStorage.setItem(LS_CLIENT, JSON.stringify(client)); } catch(e){} }

/* ==================== TOASTS ==================== */
function toast(msg, type){
  var root = document.getElementById("toast-root");
  var el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = '<span class="ti">' + (type==="error" ? "⚠️" : type==="info" ? "ℹ️" : "✅") + '</span><div>' + esc(msg) + '</div>';
  root.appendChild(el);
  setTimeout(function(){ el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(function(){ el.remove(); }, 320); }, 3600);
}

/* ==================== THÈME ==================== */
function applyTheme(){
  var s = state.settings;
  var root = document.documentElement;
  root.style.setProperty("--primary", s.primaryColor);
  root.style.setProperty("--bg", s.bgColor);
  root.style.setProperty("--text", s.textColor);
  root.style.setProperty("--surface", s.surfaceColor);
  document.body.style.backgroundColor = s.bgColor;
  document.body.style.color = s.textColor;
  var meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", s.primaryColor);
}
function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  saveLang();
}

/* ==================== GOOGLE SHEETS (API Code.gs) ==================== */
/* — La configuration se fait en haut de ce script (SHEETS_URL).        */
/* — Si SHEETS_URL est remplie, les données de Sheets sont chargées     */
/*   automatiquement au démarrage.                                      */
/* — Fonctions disponibles aussi depuis la console :                    */
/*   window.stepstore.pullFromSheets()  /  window.stepstore.pushToSheets() */
function sheetsRequest(action, payload){
  if(!SHEETS_URL) return Promise.reject(new Error("SHEETS_URL non configurée"));
  var base = SHEETS_URL.replace(/\/+$/,"");
  var req = payload
    ? fetch(base, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({action:action}, payload))})
    : fetch(base + "?action=" + encodeURIComponent(action));
  return req.then(function(res){
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }).then(function(json){
    if(!json.success) throw new Error(json.error || "Erreur API");
    return json.data;
  });
}
function pullFromSheets(){
  return sheetsRequest("all").then(function(d){
    if(d.products && d.products.length) state.products = d.products;
    if(d.categories && d.categories.length) state.categories = d.categories;
    if(d.settings && typeof d.settings === "object") state.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings);
    saveState(); applyTheme(); renderAll();
    toast(lang === "ar" ? "تم جلب البيانات من Google Sheets" : "Données récupérées depuis Google Sheets");
  }).catch(function(e){ console.warn("[StepStore] Sheets indisponible :", e); });
}
function pushToSheets(){
  return sheetsRequest("syncAll", {products:state.products, categories:state.categories, settings:state.settings})
    .then(function(){ toast(lang === "ar" ? "تم إرسال البيانات إلى Google Sheets" : "Données envoyées vers Google Sheets"); })
    .catch(function(e){ toast(lang === "ar" ? "فشل الإرسال إلى Sheets" : "Échec de l'envoi vers Sheets", "error"); });
}
window.stepstore = { pullFromSheets:pullFromSheets, pushToSheets:pushToSheets };

/* ==================== PANIER ==================== */
function cartCount(){ return cart.reduce(function(s,i){ return s + i.qty; }, 0); }
function cartSubtotal(){
  var byId = {}; state.products.forEach(function(p){ byId[p.id] = p; });
  return cart.reduce(function(s,i){ var p = byId[i.productId]; return s + (p ? p.price*i.qty : 0); }, 0);
}
function addToCart(productId, size, color, qty){
  qty = qty || 1;
  var existing = null;
  cart.forEach(function(i){ if(i.productId===productId && i.size===size && i.color===color) existing = i; });
  if(existing){ existing.qty = Math.min(existing.qty + qty, 99); }
  else { cart.push({id:uid("ci"), productId:productId, size:size, color:color, qty:qty}); }
  saveCart(); renderDrawer(); renderHeader();
}
function updateQty(id, delta){
  cart = cart.filter(function(i){ if(i.id===id){ i.qty += delta; } return i.qty > 0; });
  saveCart(); renderDrawer(); renderHeader();
}
function removeFromCart(id){ cart = cart.filter(function(i){ return i.id !== id; }); saveCart(); renderDrawer(); renderHeader(); }

/* ==================== WHATSAPP ==================== */
function buildOrderMessage(customer){
  var byId = {}; state.products.forEach(function(p){ byId[p.id] = p; });
  var storeName = trLocalized(state.settings.storeName, state.settings.storeNameAr);
  var lines = ["🛒 *" + t("wa.newOrder") + " — " + storeName + "*", t("wa.intro"), ""];
  var subtotal = 0, n = 0;
  cart.forEach(function(item){
    var p = byId[item.productId]; if(!p) return;
    n++;
    subtotal += p.price * item.qty;
    lines.push(n + ". " + p.name);
    lines.push("   " + t("wa.size") + " " + item.size + " · " + item.color + " · × " + item.qty);
    lines.push("   " + fmt(p.price * item.qty));
    lines.push("");
  });
  var shipping = subtotal >= state.settings.freeShippingFrom ? 0 : SHIPPING_FEE;
  var discount = promoApplied ? Math.round(subtotal * 0.1) : 0;
  lines.push("──────────────");
  lines.push(t("wa.subtotal") + " : " + fmt(subtotal));
  lines.push(t("wa.delivery") + " : " + (shipping === 0 ? t("wa.free") : fmt(shipping)));
  if(discount > 0) lines.push(t("wa.promo", {code:PROMO_CODE}) + " : -" + fmt(discount));
  lines.push("*" + t("wa.total") + " : " + fmt(subtotal - discount + shipping) + "*");
  lines.push("");
  lines.push("👤 " + t("wa.name") + " : " + (customer && customer.name ? customer.name : t("wa.toComplete")));
  lines.push("📞 " + t("wa.phone") + " : " + (customer && customer.phone ? customer.phone : t("wa.toComplete")));
  lines.push("📍 " + t("wa.address") + " : " + (customer && customer.address ? customer.address : t("wa.toComplete")));
  return lines.join("\n");
}
function openWhatsApp(msg){
  var num = String(state.settings.whatsappNumber || "").replace(/[^0-9]/g, "");
  if(!num){ toast(t("cp.whatsappNone"), "error"); return false; }
  window.open("https://wa.me/" + num + "?text=" + encodeURIComponent(msg), "_blank", "noopener,noreferrer");
  toast(t("cp.whatsappOk"));
  return true;
}

/* ==================== ROUTEUR ==================== */
var lastHash = "";
function route(){
  var h = (location.hash || "#/").replace(/^#\/?/, "");
  var qIdx = h.indexOf("?");
  var query = {};
  if(qIdx > -1){
    var qs = h.slice(qIdx + 1);
    h = h.slice(0, qIdx);
    try { query = Object.fromEntries(new URLSearchParams(qs)); } catch(e){ query = {}; }
  }
  var parts = h.split("/").filter(Boolean);
  return { page: parts[0] || "home", sub: parts[1] || "", query: query };
}
window.addEventListener("hashchange", function(){
  var r = route();
  menuOpen = false;
  if(cartOpen){ cartOpen = false; renderDrawer(); }
  cleanup3D();
  renderMain();
  renderHeader();
  if(location.hash !== lastHash){ window.scrollTo({top:0, behavior:"instant"}); }
  lastHash = location.hash;
});

/* ==================== CARTE PRODUIT (tilt 3D) ==================== */
function productCardHTML(p, i){
  var disc = (p.oldPrice && p.oldPrice > p.price) ? Math.round((p.oldPrice - p.price)/p.oldPrice*100) : 0;
  var sw = "";
  p.colors.slice(0,4).forEach(function(c){ sw += '<span class="p-swatch" style="background:' + esc(c.hex) + '" title="' + esc(c.name) + '"></span>'; });

  var html = '<a class="p-card" href="#/produit/' + encodeURIComponent(p.id) + '" data-tilt>';
  html += '<div class="p-glare"></div>';

  html += '<img src="' + esc(p.images[0]) + '" alt="' + esc(p.name) + '" loading="lazy" />';
  html += '<div class="p-badges">';
  if(disc) html += '<span class="p-badge">-' + disc + '%</span>';
  if(p.popular) html += '<span class="p-badge dark">★ ' + t("card.popular") + '</span>';
  html += '</div>';
  html += '<span class="p-badge3d">🧊 ' + t("card.3d") + '</span>';
  html += '<button type="button" class="btn btn-primary btn-sm quick-add" data-action="quick-add" data-id="' + esc(p.id) + '">🛒 ' + t("card.add") + '</button>';
  html += '</div>';
  html += '<div class="p-card-body">';
  html += '<div class="p-meta"><span class="p-brand">' + esc(p.brand) + '</span><span class="p-rating">⭐ ' + Number(p.rating).toFixed(1) + '</span></div>';
  html += '<span class="p-name">' + esc(p.name) + '</span>';

  if(p.oldPrice) html += '<s>' + fmt(p.oldPrice) + '</s>';
  html += '</div><div class="p-swatches">' + sw + '</div>';
  html += '</div></a>';
  return html;
}

/* ---- POPULAIRE ---- */
var popBrand = "all", popSort = "popular", popScope = "popular";
function popularHTML(r){
  var cat = r.query.cat || "all";
  var brands = [];
  state.products.forEach(function(p){ if(brands.indexOf(p.brand) === -1) brands.push(p.brand); });
  brands.sort();
  var list = (popScope === "popular") ? state.products.filter(function(p){ return p.popular; }) : state.products.slice();
  if(cat !== "all") list = list.filter(function(p){ return p.category === cat; });
  if(popBrand !== "all") list = list.filter(function(p){ return p.brand === popBrand; });
  if(popSort === "price-asc") list.sort(function(a,b){ return a.price - b.price; });
  if(popSort === "price-desc") list.sort(function(a,b){ return b.price - a.price; });
  if(popSort === "rating") list.sort(function(a,b){ return b.rating - a.rating; });
  var activeFilters = (cat !== "all" ? 1 : 0) + (popBrand !== "all" ? 1 : 0) + (popScope === "all" ? 1 : 0);
  var html = "";
  html += '<section class="page-head surface"><div class="container">';
  html += '<span class="eyebrow">' + t("pop.eyebrow") + '</span><h1>' + t("pop.title") + '</h1><p>' + t("pop.sub") + '</p>';
  html += '</div></section>';
  html += '<div class="filters-bar"><div class="container filters-inner">';
  html += '<div style="display:flex;border:1.5px solid rgba(0,0,0,.1);border-radius:999px;padding:3px">';
  html += '<button type="button" data-action="pop-scope" data-v="popular" class="btn btn-sm ' + (popScope==="popular" ? "btn-dark" : "btn-ghost") + '">' + t("pop.scopePop") + '</button>';
  html += '<button type="button" data-action="pop-scope" data-v="all" class="btn btn-sm ' + (popScope==="all" ? "btn-dark" : "btn-ghost") + '">' + t("pop.scopeAll") + '</button>';
  html += '</div>';
  html += '<select class="input" style="width:auto;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700" data-action="pop-brand"><option value="all">' + t("pop.brands") + '</option>';
  brands.forEach(function(b){ html += '<option value="' + esc(b) + '"' + (popBrand===b?" selected":"") + '>' + esc(b) + '</option>'; });
  html += '</select>';
  html += '<select class="input" style="width:auto;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700" data-action="pop-sort">';
  [["popular",t("pop.sortPop")],["rating",t("pop.sortRating")],["price-asc",t("pop.sortAsc")],["price-desc",t("pop.sortDesc")]].forEach(function(o){
    html += '<option value="' + o[0] + '"' + (popSort===o[0]?" selected":"") + '>' + o[1] + '</option>';
  });
  html += '</select>';
  html += '<div class="cats">';
  html += '<button type="button" data-action="pop-cat" data-v="all" class="chip ' + (cat==="all"?"chip-active":"") + '">' + t("pop.all") + '</button>';
  state.categories.forEach(function(c){
    html += '<button type="button" data-action="pop-cat" data-v="' + esc(c.id) + '" class="chip ' + (cat===c.id?"chip-active":"") + '">' + c.emoji + ' ' + esc(c.name) + '</button>';
  });
  html += '</div>';
  if(activeFilters > 0){
    html += '<button type="button" data-action="pop-reset" class="btn btn-sm btn-red">✕ ' + t("pop.reset", {n:activeFilters}) + '</button>';
  }
  html += '</div></div>';
  html += '<section class="section"><div class="container">';
  html += '<p class="count-line">' + (list.length === 1 ? t("pop.found1", {count:list.length}) : t("pop.foundN", {count:list.length})) + '</p>';
  if(list.length === 0){
    html += '<div class="empty-state"><div class="ico">🔍</div><h2>' + t("pop.empty") + '</h2><p>' + t("pop.emptySub") + '</p>';
    html += '<button type="button" class="btn btn-primary" style="margin-top:18px" data-action="pop-reset">' + t("pop.resetFilters") + '</button></div>';
  } else {
    html += '<div class="grid-products">' + list.map(productCardHTML).join("") + '</div>';
  }
  html += '</div></section>';
  return html;
}

/* ---- FICHE PRODUIT ---- */
var pdView = "3d", pdImg = 0, pdColor = 0, pdSize = null, pdQty = 1, pdSizeErr = false, pd3dFailedOnce = false, pdCurrentId = "";
function productHTML(id){
  /* Réinitialiser les choix quand on change de produit */
  if(pdCurrentId !== id){
    pdCurrentId = id;
    pdImg = 0; pdColor = 0; pdSize = null; pdQty = 1; pdSizeErr = false;
    pdView = pd3dFailedOnce ? "photo" : "3d";
  }
  var p = null;
  state.products.forEach(function(x){ if(x.id === id) p = x; });
  if(!p){
    return '<div class="container"><div class="empty-state" style="margin-top:60px"><div class="ico">👟</div><h2>' + t("p.notFound") + '</h2><p>' + t("p.notFoundSub") + '</p><a href="#/populaire" class="btn btn-primary" style="margin-top:18px">' + t("p.back") + '</a></div></div>';

  var cat = state.categories.find(function(c){ return c.id === p.category; });
  var disc = (p.oldPrice && p.oldPrice > p.price) ? Math.round((p.oldPrice - p.price)/p.oldPrice*100) : 0;
  var related = state.products.filter(function(x){ return x.category === p.category && x.id !== p.id; }).slice(0,4);
  var html = "";

  html += '<button type="button" data-action="pd-view" data-v="3d" class="' + (pdView==="3d"?"on":"") + '">🧊 ' + t("p3d.view3d") + '</button>';
  html += '<button type="button" data-action="pd-view" data-v="photo" class="' + (pdView==="photo"?"on dark":"") + '">📷 ' + t("p3d.photos") + '</button>';
  html += '</div>';
  html += '<div class="pd-stage" id="pd-stage" data-mode="' + pdView + '">';
  if(pdView === "photo"){
    html += '<img id="pd-main-img" src="' + esc(p.images[pdImg]) + '" alt="' + esc(p.name) + '" />';

    html += '<div class="pd-loading" id="pd-loading"><div class="box"><div class="spinner"></div><span style="font-size:12px;font-weight:700;color:rgba(0,0,0,.6)">' + t("p3d.loading") + '</span></div></div>';
    html += '<div id="pd-3d-host" style="position:absolute;inset:0"></div>';

  if(disc) html += '<span class="p-badge" style="position:absolute;top:14px;inset-inline-start:14px;z-index:3">-' + disc + '%</span>';

  if(pdView === "3d") html += '<span class="hint">🖱️ ' + t("p3d.hint") + '</span>';
  html += '</div>';
  html += '<div class="pd-thumbs" id="pd-thumbs">';

    html += '<button type="button" class="pd-thumb ' + (i===pdImg?"on":"") + '" data-action="pd-thumb" data-idx="' + i + '"><img src="' + esc(img) + '" alt="' + t("p.view", {n:i+1}) + '" /></button>';
  });
  html += '</div></div>';

  html += '<h1>' + esc(p.name) + '</h1>';
  html += '<div class="pd-rate"><span class="stars">★</span> <span>' + t("p.rating", {rating:Number(p.rating).toFixed(1)}) + '</span>';
  html += '<span class="stock-pill ' + (p.stock > 0 ? "ok" : "ko") + '"><span class="dot"></span>' + (p.stock > 0 ? t("p.inStock", {count:p.stock}) : t("p.out")) + '</span></div>';

  html += '</div>';

  html += '<div class="opt-block"><div class="opt-title">' + t("p.color") + ' <b id="pd-color-name">' + esc(p.colors[pdColor] ? p.colors[pdColor].name : "") + '</b></div>';

  html += '<div class="pd-perks"><span><span class="pi">🚚</span>' + t("p.ship") + '</span><span><span class="pi">🔄</span>' + t("p.ret") + '</span><span><span class="pi">🛡️</span>' + t("p.auth") + '</span></div>';

function afterMainRender(){
  var r = route();
  if(r.page === "produit" && pdView === "3d"){
    var host = document.getElementById("pd-3d-host");
    if(host) init3D(host);
  }
  /* Tilt 3D sur les cartes */
  document.querySelectorAll("[data-tilt]").forEach(function(card){
    card.addEventListener("mousemove", function(e){
      var rect = card.getBoundingClientRect();
      var px = (e.clientX - rect.left)/rect.width - 0.5;
      var py = (e.clientY - rect.top)/rect.height - 0.5;
      card.style.transform = "perspective(950px) rotateX(" + (-py*9) + "deg) rotateY(" + (px*9) + "deg) translateY(-8px) scale(1.02)";
      card.style.transition = "transform .06s linear";
      card.querySelector(".p-glare").style.background = "radial-gradient(420px circle at " + ((px+0.5)*100) + "% " + ((py+0.5)*100) + "%, rgba(255,255,255,.5) 0%, rgba(255,255,255,.1) 32%, transparent 60%)";
    });
    card.addEventListener("mouseleave", function(){
      card.style.transform = "";
      card.style.transition = "transform .45s cubic-bezier(.22,1,.36,1)";
    });
  });
}

/* ==================== VUE 3D (THREE.JS VIA CDN) ==================== */
var cleanup3D = function(){};
function init3D(host){
  if(pd3dFailedOnce){ return; }
  var disposed = false;
  cleanup3D();
  cleanup3D = function(){ disposed = true; };
  var modelUrls = [
    "https://vazxmixjsiawhamofees.supabase.co/storage/v1/object/public/models/shoe/model.gltf",
    "https://raw.githubusercontent.com/pmndrs/market-assets/master/files/shoe.glb"
  ];
  var loadingEl = document.getElementById("pd-loading");
  var renderer = null, scene = null, camera = null, controls = null, ro = null;
  var finish = function(ok){
    if(disposed) return;
    if(!ok){
      pdView = "photo"; pd3dFailedOnce = true;
      toast(t("p3d.error"), "info");
      cleanup3D(); renderMain();
      return;
    }
    if(loadingEl) loadingEl.style.display = "none";
  };
  Promise.all([
    import("three"),
    import("three/addons/controls/OrbitControls.js"),
    import("three/addons/loaders/GLTFLoader.js")
  ]).then(function(mods){
    if(disposed) return;
    var THREE = mods[0];
    var OrbitControls = mods[1].OrbitControls;
    var GLTFLoader = mods[2].GLTFLoader;
    try {
      renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:"high-performance"});
    } catch(e){ finish(false); return; }
    var w = host.clientWidth || 1, h = host.clientHeight || 1;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(w, h);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    host.appendChild(renderer.domElement);
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(32, w/h, 0.1, 100);
    camera.position.set(0.4, 0.9, 5.2);
    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    var key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(5,7,4); key.castShadow = true;
    key.shadow.mapSize.set(1024,1024);
    ["left","right","top","bottom"].forEach(function(k){ key.shadow.camera[k] = 6; });
    key.shadow.camera.near = 1; key.shadow.camera.far = 30;
    scene.add(key);
    var rim = new THREE.DirectionalLight(0xffd9c2, 0.8); rim.position.set(-5,3,-4); scene.add(rim);
    var ground = new THREE.Mesh(new THREE.PlaneGeometry(12,12), new THREE.ShadowMaterial({opacity:0.35}));
    ground.rotation.x = -Math.PI/2; ground.position.y = -1.35; ground.receiveShadow = true; scene.add(ground);
    controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0,0.05,0); controls.autoRotate = true; controls.autoRotateSpeed = 1.7;
    controls.enablePan = false; controls.enableDamping = true;
    controls.minDistance = 2.6; controls.maxDistance = 7.5;
    controls.minPolarAngle = Math.PI/4.5; controls.maxPolarAngle = Math.PI/1.9;
    renderer.setAnimationLoop(function(){ if(disposed) return; controls.update(); renderer.render(scene, camera); });
    ro = new ResizeObserver(function(){
      var w2 = host.clientWidth || 1, h2 = host.clientHeight || 1;
      camera.aspect = w2/h2; camera.updateProjectionMatrix(); renderer.setSize(w2,h2);
    });
    ro.observe(host);
    cleanup3D = function(){
      disposed = true;
      if(ro) ro.disconnect();
      if(renderer){ renderer.setAnimationLoop(null); renderer.dispose(); if(renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement); }
    };
    var loader = new GLTFLoader();
    var loadIdx = function(i){
      if(disposed) return;
      if(i >= modelUrls.length){ finish(false); return; }
      loader.load(modelUrls[i], function(gltf){
        if(disposed) return;
        var model = gltf.scene;
        var box = new THREE.Box3().setFromObject(model);
        var size = box.getSize(new THREE.Vector3());
        var maxDim = Math.max(size.x, size.y, size.z) || 1;
        model.scale.setScalar(2.1/maxDim);
        model.position.y = -1.35 - box.min.y * (2.1/maxDim);
        model.traverse(function(obj){
          if(obj.isMesh){ obj.castShadow = true; obj.receiveShadow = true; }
        });
        scene.add(model);
        finish(true);
      }, undefined, function(){ loadIdx(i+1); });
    };
    loadIdx(0);
  }).catch(function(){
    finish(false);
  });
}

/* ==================== ÉVÉNEMENTS ==================== */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  e.preventDefault();
  var action = el.getAttribute("data-action");
  var id = el.getAttribute("data-id");
  var idx = parseInt(el.getAttribute("data-idx") || "0", 10);
  var v = el.getAttribute("data-v");
  var r = route();

  switch(action){
    /* GLOBAL */
    case "lang-fr": lang = "fr"; applyLang(); renderAll(); break;
    case "lang-ar": lang = "ar"; applyLang(); renderAll(); break;
    case "menu-toggle": menuOpen = !menuOpen; renderHeader(); break;
    case "open-cart": cartOpen = true; renderDrawer(); break;
    case "close-cart": cartOpen = false; renderDrawer(); break;

    /* PRODUITS */
    case "quick-add":
      var p = state.products.find(function(x){ return x.id === id; });
      if(p){
        if(p.stock <= 0){ toast(t("card.noStock"), "error"); break; }
        addToCart(p.id, p.sizes[0] || "M", p.colors[0] ? p.colors[0].name : "Standard", 1);
        cartOpen = true; renderDrawer();
        toast(t("p.added", {name:p.name}));
      }
      break;

    /* POPULAIRE */
    case "pop-scope": popScope = v; renderMain(); break;
    case "pop-brand": popBrand = el.value; renderMain(); break;
    case "pop-sort": popSort = el.value; renderMain(); break;
    case "pop-cat":
      if(v === "all"){ location.hash = "#/populaire"; }
      else { location.hash = "#/populaire?cat=" + encodeURIComponent(v); }
      renderMain();
      break;
    case "pop-reset":
      popBrand = "all"; popSort = "popular"; popScope = "popular";
      location.hash = "#/populaire";
      renderMain();
      break;

    /* FICHE PRODUIT */
    case "pd-view": pdView = v; cleanup3D(); renderMain(); break;
    case "pd-thumb":
      pdImg = idx; cleanup3D(); renderMain();
      break;
    case "pd-color":
      pdColor = idx;
      var swWrap = document.getElementById("pd-swatches");
      if(swWrap){
        Array.prototype.forEach.call(swWrap.querySelectorAll(".swatch"), function(b, i){
          b.classList.toggle("on", i === idx);
          b.textContent = i === idx ? "✓" : "";
        });
      }
      var nameEl = document.getElementById("pd-color-name");
      if(nameEl){
        var prod = state.products.find(function(x){ return x.id === r.sub; });
        if(prod && prod.colors[idx]) nameEl.textContent = prod.colors[idx].name;
      }
      break;
    case "pd-size":
      pdSize = v; pdSizeErr = false;
      var szWrap = document.getElementById("pd-sizes");
      if(szWrap){
        Array.prototype.forEach.call(szWrap.querySelectorAll(".size-btn"), function(b){
          b.classList.toggle("on", b.getAttribute("data-v") === v);
        });
      }
      var errEl = document.getElementById("pd-size-err");
      if(errEl) errEl.style.display = "none";
      break;
    case "pd-qty-inc":
      pdQty = Math.min(99, pdQty + 1);
      var qEl = document.getElementById("pd-qty");
      if(qEl) qEl.textContent = pdQty;
      break;
    case "pd-qty-dec":
      pdQty = Math.max(1, pdQty - 1);
      var qEl2 = document.getElementById("pd-qty");
      if(qEl2) qEl2.textContent = pdQty;
      break;
    case "pd-add":
      var prod2 = state.products.find(function(x){ return x.id === r.sub; });
      if(prod2){
        if(!pdSize){
          pdSizeErr = true;
          var errEl2 = document.getElementById("pd-size-err");
          if(errEl2) errEl2.style.display = "block";
          toast(t("p.chooseSize"), "error");
          break;
        }
        addToCart(prod2.id, pdSize, prod2.colors[pdColor] ? prod2.colors[pdColor].name : "Standard", pdQty);
        cartOpen = true; renderDrawer();
        toast(t("p.added", {name:prod2.name}));
      }
      break;

    /* PANIER */
    case "cart-inc": updateQty(id, 1); break;
    case "cart-dec": updateQty(id, -1); break;
    case "cart-del": removeFromCart(id); break;
    case "cart-clear": cart = []; promoApplied = false; saveCart(); renderDrawer(); renderHeader(); renderMain(); toast(t("cp.cleared"), "info"); break;
    case "drawer-checkout":
      if(cart.length === 0) break;
      cartOpen = false; renderDrawer();
      openWhatsApp(buildOrderMessage(null));
      break;

    /* ADMIN : NAVIGATION */
    case "admin-logout":
      isAdmin = false;
      try { sessionStorage.removeItem("stepstore_admin"); } catch(err){}
      renderAll();
      break;

    /* ADMIN : ARTICLES */
    case "pm-new": openProductForm(null); break;
    case "pm-edit":
      var pe = state.products.find(function(x){ return x.id === id; });
      if(pe) openProductForm(pe);
      break;
    case "pm-close": prodDraft = null; renderMain(); break;
    case "pm-delete":
      var pd2 = state.products.find(function(x){ return x.id === id; });
      if(pd2){ confirmDelete = {type:"product", item:pd2}; renderMain(); }
      break;
    case "pm-save":
      if(!prodDraft.name.trim() || !prodDraft.brand.trim() || !prodDraft.price){ toast(t("pm.required"), "error"); break; }
      var newP = {
        id: prodDraft.id || uid("article"),
        name: prodDraft.name.trim(), brand: prodDraft.brand.trim(), category: prodDraft.category,
        price: parseFloat(String(prodDraft.price).replace(",", ".")) || 0,
        oldPrice: prodDraft.oldPrice ? (parseFloat(String(prodDraft.oldPrice).replace(",", ".")) || 0) : 0,
        description: prodDraft.description, images: prodDraft.images.length ? prodDraft.images :
          [IMG(26852035)], colors: prodDraft.colors.filter(function(c){ return c.name.trim(); }),
        sizes: parseList(prodDraft.sizesText), popular: prodDraft.popular,
        stock: parseInt(prodDraft.stock, 10) || 0, rating: Math.min(5, Math.max(0, parseFloat(String(prodDraft.rating).replace(",", ".")) || 0))
      };
      var found = false;
      state.products = state.products.map(function(x){ if(x.id === newP.id){ found = true; return newP; } return x; });
      if(!found) state.products.push(newP);
      saveState(); prodDraft = null; renderMain();
      toast(t("pm.saved"));
      break;
    case "draft-img-add":
      var url = (document.getElementById("draft-img-url") || {}).value || "";
      if(url.trim()){ prodDraft.images.push(url.trim()); renderMain(); }
      break;
    case "draft-img-del":
      prodDraft.images.splice(idx, 1); renderMain();
      break;
    case "draft-color-add":
      prodDraft.colors.push({name:"", hex:"#888888"}); renderMain();
      break;
    case "draft-color-del":
      prodDraft.colors.splice(idx, 1); renderMain();
      break;

    /* ADMIN : CATÉGORIES */
    case "cm-new": catDraft = {id:"", name:"", emoji:"👟", image:"", imageUrl:""}; renderMain(); break;
    case "cm-edit":
      var ce = state.categories.find(function(x){ return x.id === id; });
      if(ce) catDraft = {id:ce.id, name:ce.name, emoji:ce.emoji, image:ce.image, imageUrl:""};
      renderMain();
      break;
    case "cm-close": catDraft = null; renderMain(); break;
    case "cm-delete":
      var cd = state.categories.find(function(x){ return x.id === id; });
      if(cd){ confirmDelete = {type:"category", item:cd}; renderMain(); }
      break;
    case "cm-save":
      if(!catDraft.name.trim()){ toast(t("cm.required"), "error"); break; }
      var newC = { id: catDraft.id || uid("cat"), name: catDraft.name.trim(), emoji: catDraft.emoji.trim() || "👟",
        image: catDraft.image || catDraft.imageUrl || IMG(26852035) };
      var cFound = false;
      state.categories = state.categories.map(function(x){ if(x.id === newC.id){ cFound = true; return newC; } return x; });
      if(!cFound) state.categories.push(newC);
      saveState(); catDraft = null; renderMain();
      toast(t("cm.saved"));
      break;

    /* CONFIRMATION */
    case "confirm-cancel": confirmDelete = null; renderMain(); break;
    case "confirm-ok":
      if(confirmDelete.type === "product"){
        state.products = state.products.filter(function(x){ return x.id !== confirmDelete.item.id; });
        toast(t("pm.deleted"), "info");
      } else {
        state.categories = state.categories.filter(function(x){ return x.id !== confirmDelete.item.id; });
        toast(t("cm.deleted"), "info");
      }
      saveState(); confirmDelete = null; renderMain();
      break;

    /* ADMIN : APPARENCE */
    case "sm-reset":
      state.products = DEFAULT_PRODUCTS.slice();
      state.categories = DEFAULT_CATEGORIES.slice();
      state.settings = Object.assign({}, DEFAULT_SETTINGS);
      saveState(); applyTheme(); renderAll();
      toast(t("sm.resetOk"));
      break;
    case "logo-remove":
      state.settings.logoUrl = ""; saveState(); renderHeader(); renderFooter(); renderMain();
      break;
    case "wa-save":
      waDraft = String((document.getElementById("wa-num") || {}).value || "").replace(/[^0-9]/g, "");
      state.settings.whatsappNumber = waDraft; saveState(); renderMain();
      toast(t("sm.waSaved"));
      break;
    case "wa-test":
      openWhatsApp("✅ " + trLocalized(state.settings.storeName, state.settings.storeNameAr) + " — " + t("sm.waTestOk"));
      break;
    case "pwd-save":
      pwdDraft = ((document.getElementById("pwd-input") || {}).value || "").trim();
      if(pwdDraft.length < 4){ toast(t("sm.pwdErr"), "error"); break; }
      state.settings.adminPassword = pwdDraft; saveState(); renderMain();
      toast(t("sm.pwdOk"));
      break;
  }
});

/* Liaison champs (data-bind) — mise à jour en direct sans re-rendu */
function bindInput(el){
  var path = (el.getAttribute("data-bind") || "").split(".");
  var val = el.type === "checkbox" ? el.checked : el.value;
  if(path[0] === "draft"){
    if(path[1] === "colors"){
      var ci = parseInt(path[2], 10);
      if(prodDraft.colors[ci]) prodDraft.colors[ci][path[3]] = val;
    } else {
      setByPath(prodDraft, path.slice(1), val);
    }
  } else if(path[0] === "catdraft"){
    setByPath(catDraft, path.slice(1), val);
  } else if(path[0] === "settings"){
    setByPath(state.settings, path.slice(1), val);
    saveState();
    if(["primaryColor","bgColor","textColor","surfaceColor"].indexOf(path[1]) > -1) applyTheme();
  }
}
document.addEventListener("input", function(e){
  var el = e.target.closest("[data-bind]");
  if(el) bindInput(el);
  /* Recherche admin (sans re-rendu complet) */
  if(e.target && e.target.id === "pm-search"){
    pmSearch = e.target.value;
    var listEl = document.getElementById("pm-list");
    if(listEl){
      var q = pmSearch.trim().toLowerCase();
      var filtered = state.products.filter(function(p){
        if(!q) return true;
        var catName = (state.categories.find(function(c){ return c.id===p.category; }) || {}).name || "";
        return (p.name + " " + p.brand + " " + catName).toLowerCase().indexOf(q) > -1;
      });
      listEl.innerHTML = productsListHTML(filtered);
    }
  }
});
/* Uploads de fichiers */
document.addEventListener("change", function(e){
  var el = e.target.closest("[data-upload]");
  if(!el) return;
  var file = el.files && el.files[0];
  if(!file) return;
  var target = el.getAttribute("data-upload");
  readFileAsDataUrl(file, function(dataUrl){
    if(!dataUrl){ toast(t("pm.imgErr"), "error"); return; }
    if(target === "draft.images"){ prodDraft.images.push(dataUrl); renderMain(); toast(t("pm.imgAdded")); }
    else if(target === "catdraft.image"){ catDraft.image = dataUrl; renderMain(); }
    else if(target.indexOf("settings.") === 0){
      var field = target.split(".")[1];
      state.settings[field] = dataUrl;
      saveState(); renderMain(); renderHeader(); renderFooter();
      toast(t("sm.imported"));
    }
  });
});

/* Formulaire newsletter */
window.onNewsletter = function(e){
  e.preventDefault();
  var val = (document.getElementById("news-email") || {}).value || "";
  if(val.indexOf("@") > -1){ toast(t("footer.newsOk")); e.target.reset && e.target.reset(); }
  else { toast(t("footer.newsErr"), "error"); }
  return false;
};

/* ==================== DÉMARRAGE ==================== */
applyLang();
applyTheme();
renderAll();
lastHash = location.hash;
/* Chargement automatique depuis Google Sheets si SHEETS_URL est configurée */
if(SHEETS_URL){ pullFromSheets(); }
</script>
